# Host Vue 3. Trình duyệt không vào thẳng đây: nginx của host Vue 2 (ipos-cms-pos-android/nginx)
# proxy /_v3_host/ sang, và trả /_v3_host/index.html cho mọi URL khi cookie ui_version=v3.
map $uri $v3_cache_control {
  "~^/_v3_host/assets/" "public, max-age=31536000, immutable";
  default "no-store, no-cache, must-revalidate, max-age=0";
}

server {
  listen 80;
  server_name localhost;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

  # Bản build có base /_v3_host/ (vite.config.ts) nhưng nằm ở gốc html/.
  # Không fallback về index.html: thiếu chunk phải trả 404 thật để app báo tải lại.
  location ^~ /_v3_host/ {
    alias /usr/share/nginx/html/;
    index index.html;
    add_header Cache-Control $v3_cache_control always;
  }

  location / {
    return 404;
  }
}
